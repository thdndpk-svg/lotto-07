<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>로또 패턴 PRO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 font-sans antialiased text-slate-900">
    <div class="max-w-md mx-auto min-h-screen flex flex-col p-6">
        <!-- 헤더 -->
        <header class="text-center mb-8">
            <h1 class="text-3xl font-black text-indigo-600 flex justify-center items-center gap-2">
                <i data-lucide="trending-up"></i> 로또패턴 PRO
            </h1>
            <p id="last-update" class="text-slate-400 text-xs mt-2">데이터 로딩 중...</p>
        </header>

        <!-- 번호 생성 카드 -->
        <main class="flex-1 space-y-6">
            <div class="bg-white rounded-[2rem] p-8 shadow-xl shadow-indigo-100 border border-indigo-50 text-center">
                <div id="number-display" class="flex justify-center gap-2 mb-8 h-12 items-center text-slate-300 italic">
                    행운의 번호를 생성하세요
                </div>
                
                <div class="flex gap-3">
                    <button onclick="generateNumbers()" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 rounded-2xl transition-all flex justify-center items-center gap-2 shadow-lg shadow-indigo-200 active:scale-95">
                        <i data-lucide="refresh-cw" class="w-5 h-5"></i> 번호 생성
                    </button>
                    <button id="save-btn" onclick="saveNumbers()" disabled class="px-6 bg-emerald-500 text-white rounded-2xl disabled:opacity-30 disabled:grayscale transition-all shadow-lg shadow-emerald-100 active:scale-95">
                        <i data-lucide="save" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>

            <!-- 저장 목록 -->
            <section class="space-y-4">
                <h2 class="font-bold text-slate-700 flex items-center gap-2 px-2">
                    나의 저장 목록 <span id="save-count" class="bg-indigo-100 text-indigo-600 px-2 py-0.5 rounded-full text-xs">0</span>
                </h2>
                <div id="saved-list" class="space-y-3">
                    <!-- 저장된 번호가 여기에 추가됨 -->
                </div>
            </section>
        </main>
    </div>

    <script>
        let currentNumbers = [];
        let savedList = JSON.parse(localStorage.getItem('my-lotto-sets') || '[]');

        function init() {
            lucide.createIcons();
            updateSavedListUI();
            fetch('./data/lotto_data.json')
                .then(res => res.json())
                .then(data => {
                    const last = data[data.length - 1];
                    document.getElementById('last-update').innerText = `최신 데이터: ${last.drwNo}회차 업데이트 완료`;
                }).catch(() => {
                    document.getElementById('last-update').innerText = `데이터를 준비 중입니다 (첫 배포 시 5분 소요)`;
                });
        }

        function generateNumbers() {
            const nums = new Set();
            while(nums.size < 6) nums.add(Math.floor(Math.random() * 45) + 1);
            currentNumbers = Array.from(nums).sort((a, b) => a - b);
            
            const display = document.getElementById('number-display');
            display.innerHTML = currentNumbers.map(n => {
                let color = 'bg-slate-400';
                if(n <= 10) color = 'bg-yellow-400';
                else if(n <= 20) color = 'bg-blue-400';
                else if(n <= 30) color = 'bg-red-400';
                else if(n <= 40) color = 'bg-slate-500';
                else color = 'bg-green-500';
                return `<span class="w-9 h-9 rounded-full ${color} flex items-center justify-center text-white text-sm font-bold shadow-sm">${n}</span>`;
            }).join('');
            
            document.getElementById('save-btn').disabled = false;
        }

        function saveNumbers() {
            if(currentNumbers.length === 0) return;
            savedList.unshift([...currentNumbers]);
            localStorage.setItem('my-lotto-sets', JSON.stringify(savedList));
            updateSavedListUI();
        }

        function deleteSet(idx) {
            savedList.splice(idx, 1);
            localStorage.setItem('my-lotto-sets', JSON.stringify(savedList));
            updateSavedListUI();
        }

        function updateSavedListUI() {
            const container = document.getElementById('saved-list');
            document.getElementById('save-count').innerText = savedList.length;
            
            if(savedList.length === 0) {
                container.innerHTML = `<div class="text-center py-10 bg-white rounded-3xl border-2 border-dashed border-slate-100 text-slate-300 text-sm italic">저장된 번호가 없습니다</div>`;
                return;
            }

            container.innerHTML = savedList.map((set, idx) => `
                <div class="bg-white p-4 rounded-2xl flex justify-between items-center shadow-sm border border-slate-50 animate-in fade-in slide-in-from-bottom-2">
                    <div class="flex gap-1">
                        ${set.map(n => `<span class="w-6 h-6 rounded-full bg-slate-100 flex items-center justify-center text-[10px] font-bold text-slate-600">${n}</span>`).join('')}
                    </div>
                    <button onclick="deleteSet(${idx})" class="text-slate-300 hover:text-red-500 transition-colors">
                        <i data-lucide="trash-2" class="w-5 h-5"></i>
                    </button>
                </div>
            `).join('');
            lucide.createIcons();
        }

        init();
    </script>
</body>
</html>
