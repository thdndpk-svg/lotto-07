name: Update Lotto Data

on:
  workflow_dispatch:
  schedule:
    # 토요일 22:30 KST
    - cron: "30 13 * * 6"
    # 일요일 00:30 KST 보조 실행
    - cron: "30 15 * * 6"

permissions:
  contents: write

jobs:
  update-lotto:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Update lotto_data.json
        env:
          PYTHONUNBUFFERED: "1"
          LOTTO_HISTORY_LIMIT: "60"
        run: |
          python -u fetch_lotto.py

      - name: Validate JSON
        run: |
          python -m json.tool lotto_data.json > /tmp/lotto_data_check.json
          echo "JSON_OK"

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet lotto_data.json; then
            echo "변경 없음"
          else
            git add lotto_data.json
            git commit -m "Update lotto data"
            git push
            echo "업데이트 커밋 완료"
          fi
